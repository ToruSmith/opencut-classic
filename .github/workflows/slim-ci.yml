name: Slim CI

on:
  push:
    branches: [slim]
  workflow_dispatch:

concurrency:
  group: slim-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install
        run: .github/scripts/run-step.sh "install" bun install

      - name: Build
        working-directory: apps/web
        run: ../../.github/scripts/run-step.sh "build" bun run build
