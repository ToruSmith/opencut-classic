name: Slim CI

on:
  push:
    branches: [slim]
  workflow_dispatch:

concurrency:
  group: slim-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - name: Install
        run: .github/scripts/run-step.sh "install" bun install

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        working-directory: apps/web
        run: TAIL=150 ../../.github/scripts/run-step.sh "typecheck" bunx tsc --noEmit

      - name: Build
        working-directory: apps/web
        run: ../../.github/scripts/run-step.sh "build" bun run build

      - name: Bundle report
        working-directory: apps/web
        run: node scripts/report-bundle.mjs dist 40

      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: apps/web
        run: TAIL=150 ../../.github/scripts/run-step.sh "tests" bun test src

      - name: Fail if typecheck failed
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
