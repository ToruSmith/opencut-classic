name: Deploy to GitHub Pages

on:
  push:
    branches: [slim, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 型別檢查、打包、單元測試、shader 驗證。任何一項失敗,下面的 deploy 就不會執行。
  ci:
    uses: ./.github/workflows/slim-ci.yml

  # 建置(編譯 WASM 要好幾分鐘,所以與 ci 同時進行)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM (custom shaders)
        run: .github/scripts/run-step.sh "wasm" wasm-pack build rust/wasm --target bundler --out-dir pkg --release

      - name: Install
        run: .github/scripts/run-step.sh "install" bun install

      - name: Build
        working-directory: apps/web
        env:
          OPENCUT_WASM_LOCAL: "1"
        run: ../../.github/scripts/run-step.sh "build" bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      # 給下面的 e2e 用(upload-pages-artifact 的檔案是 tar,不方便直接取用)
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/web/dist
          retention-days: 3

  # 自動驗收:無頭 Chromium(軟體繪圖,不需要 GPU)開剛建好的網站,
  # 匯入合成素材、排時間軸、播放,檢查畫面顏色 / 快取上限 / 錯誤並輸出效能數字。
  # 不擋發佈(deploy 不依賴它):軟體繪圖環境可能有自己的限制,先當報告看。
  # 結果在該 job 的 Summary 與 annotations,說明見 AGENTS.md「自動驗收」。
  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist

      - name: 安裝 ffmpeg 與 Playwright
        working-directory: apps/web/e2e
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 產生合成素材
        run: apps/web/e2e/make-fixtures.sh e2e-fixtures

      - name: 執行驗收
        working-directory: apps/web/e2e
        run: node run.mjs --dist ../../../site-dist --fixtures ../../../e2e-fixtures --out ../../../e2e-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-out
          retention-days: 7

  # 只有 ci 與 build 都成功才會發佈
  deploy:
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 部署完成,提醒驗收
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          checklist="${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/docs/qa-checklist.md"
          echo "::notice title=deployed::${url}"
          {
            echo "### 已部署:${url}"
            echo
            echo "CI 通過不代表畫面與聲音正確。請開啟網站,依 [實機驗收清單](${checklist}) 走一遍(約 5 分鐘)。"
          } >> "$GITHUB_STEP_SUMMARY"
