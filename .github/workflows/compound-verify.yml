# Temporary verification for the compound clips PR. Compares typecheck, tests,
# lint and build between this branch and main, and reports the differences as
# annotations. Remove before merging if you don't want to keep it.
name: Compound clips verification

on:
  push:
    branches: [feature/compound-clips]
  workflow_dispatch:

concurrency:
  group: compound-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://opencut:opencut@localhost:5432/opencut"
      BETTER_AUTH_SECRET: "supersecret"
      NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
      UPSTASH_REDIS_REST_URL: "https://your-upstash-redis-url"
      UPSTASH_REDIS_REST_TOKEN: "your-upstash-redis-token"
      NEXT_PUBLIC_MARBLE_API_URL: "https://placeholder.example.com"
      MARBLE_WORKSPACE_KEY: "placeholder"
      FREESOUND_CLIENT_ID: "placeholder"
      FREESOUND_API_KEY: "placeholder"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.2.18

      - name: Install dependencies
        run: bun install

      - name: Run checks on branch and main
        run: bash .github/scripts/compound-verify.sh

      - name: Report
        run: python3 .github/scripts/compound-report.py
