name: Compound verify (temporary, no deploy)

# 暫時用:只在功能分支跑 CI + 建置 + e2e,不部署。合併前請刪除這個檔案。
on:
  push:
    branches: [feature/compound-clips-slim]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compound-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/slim-ci.yml

  # 建置(編譯 WASM 要好幾分鐘)
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.18

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM (custom shaders)
        run: .github/scripts/run-step.sh "wasm" wasm-pack build rust/wasm --target bundler --out-dir pkg --release

      - name: Install
        run: .github/scripts/run-step.sh "install" bun install

      - name: Build
        working-directory: apps/web
        env:
          OPENCUT_WASM_LOCAL: "1"
        run: ../../.github/scripts/run-step.sh "build" bun run build

      # 給下面的 e2e 用(upload-pages-artifact 的檔案是 tar,不方便直接取用)
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: apps/web/dist
          retention-days: 3

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site-dist

      - name: 安裝 ffmpeg 與 Playwright
        working-directory: apps/web/e2e
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 產生合成素材
        run: apps/web/e2e/make-fixtures.sh e2e-fixtures

      - name: 執行驗收
        working-directory: apps/web/e2e
        run: node run.mjs --dist ../../../site-dist --fixtures ../../../e2e-fixtures --out ../../../e2e-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e-out
          retention-days: 7
